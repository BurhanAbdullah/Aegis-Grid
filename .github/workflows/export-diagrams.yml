name: export-diagrams
on:
  push:
    branches: ["release/v6.1.0-rc1-hardening"]
permissions:
  contents: write
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    container: python:3.13-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regenerate and commit diagram assets
        run: |
          mkdir -p /tmp/aegis-diagrams
          FIGURES_OUT=/tmp/aegis-diagrams python "$GITHUB_WORKSPACE/scripts/make_diagrams.py"
          cp -a /tmp/aegis-diagrams/. "$GITHUB_WORKSPACE/figures/diagrams/"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add figures/diagrams/
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" commit -m "fix(figures): regenerate diagrams with pinned CI renderer"
            git -C "$GITHUB_WORKSPACE" push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload regenerated diagram assets
        uses: actions/upload-artifact@v4
        with:
          name: aegis-grid-diagram-exports
          path: /tmp/aegis-diagrams/
          if-no-files-found: error
          retention-days: 1
