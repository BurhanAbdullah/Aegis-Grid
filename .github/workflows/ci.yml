name: verify

on:
  push:
    branches: ["main", "research-integrity-remediation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Debian trixie: Python 3.13 linked against OpenSSL 3.5, needed by the
    # TLS 1.3 ML-KEM / ML-DSA baseline.
    container: python:3.13-trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-remediation.txt
      - name: Verify (tests, mutation checks, provenance, manuscript numbers, smoke runs)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/verify_all.sh --smoke
